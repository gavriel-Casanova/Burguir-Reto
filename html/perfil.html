<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link href="../css/perfil.css" rel="stylesheet">
    <link href="../css/general.css" rel="stylesheet">
</head>
<body>
    <div id="contenedor">
        <h1>Perfil</h1>

        <div id="botones">
            <button type="button" id="atras">Atras</button>
            <button type="button" id="personaje">Personaje</button> 
        </div>

        <div id="formulario">
            <form>
                <div id="campos-form">
                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre" id="nomb">

                    <label for="usuario">Usuario:</label>
                    <input type="text" name="usuario" id="user">

                    <label for="contraseña">Contraseña:</label>
                    <input type="password" name="contraseña" id="passwd">

                    <label for="confirmar">Confirmar contraseña:</label>
                    <input type="password" name="confcontraseña" id="confpasswd">

                    <label for="fecha">Fecha de nacimiento:</label>
                    <input type="date" name="fecha" id="fecha">

                    <label for="correo">Correo:</label>
                    <input type="email" name="correo" id="correo">
                </div>
                
                <div id="btnform">
                    <button type="button" id="registrarse">Registrarse</button>
                    <button type="button" id="usuario">Nuevo usuario</button>
                    <button type="button" id="actualizar">Actualizar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
