<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link href="/css/perfil.css" rel="stylesheet">
    <link href="/css/general.css" rel="stylesheet">
</head>
<body>
    <div id="contenedor">
        <h1>Perfil</h1>

        <div id="botones">
            <button type="button" id="atras">Atras</button>
            <button type="button" id="personaje">Personaje</button> 
        </div>

        <div id="formulario">
            <form>
                <label for="nombre">Nombre:</label><br>
                <input type="text" name="nombre" id="nomb"><br><br>

                <label for="usuario">Usuario:</label><br>
                <input type="text" name="usuario" id="user"><br><br>

                <label for="contraseña">Contraseña:</label><br>
                <input type="password" name="contraseña" id="passwd"><br><br>

                <label for="confirmar">Confirmar contraseña:</label><br>
                <input type="password" name="confcontraseña" id="confpasswd"><br><br>

                <label for="fecha">Fecha de nacimiento:</label><br>
                <input type="date" name="fecha" id="fecha"><br><br>

                <label for="correo">Correo:</label><br>
                <input type="email" name="correo" id="correo"><br><br>    
                
                <button type="button" id="registrarse">Registrarse</button>
                <button type="button" id="usuario">Nuevo usuario</button>
                <button type="button" id="actualizar">Actualizar</button>
            </form>
        </div>
    </div>
</body>
</html>
