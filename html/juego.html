<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burguir</title>
    <link rel="stylesheet" href="../css/juego.css">
    <link rel="stylesheet "href="../css/general.css" >
</head>

<body>

    <div class="contenedor">

        <div class="cronometro">
            <div id="tiempo">
                <span id="minutos">00</span>:<span id="segundos">00</span>
            </div>
            <div id="imagen_reloj">
                <img src="/media/img/comida/reloj.png" alt="Reloj" id="reloj">
            </div>
        </div>
        <div class="contenedor_principal">
            <div class="contenedor_1">
                <div id="imagen_comanda">
                    <img src="/media/img/comida/comanda.png" alt="Comanda" id="comanda">
                    <div id="lista_comanda"></div>
                </div>
            </div>

            <div class="contenedor_2">
                <div id="botonera">
                    <img src="/media/img/comida/agua.png" id="agua">
                    <img src="/media/img/comida/ensalada.png" id="ensalada">
                    <img src="/media/img/comida/hamburguesa.png" id="hamburguesa">
                    <img src="/media/img/comida/helado.png" id="helado">
                    <img src="/media/img/comida/nachos.png" id="nachos">
                    <img src="/media/img/comida/refresco.png" id="refresco">
                    <img src="/media/img/comida/patatas.png" id="patatas">
                    <img src="/media/img/comida/tarta.png" id="tarta">
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/juego.js"></script>


</body>
</html>
