<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <link  rel="stylesheet" href="../css/general.css">
    <title>Inicio De sesion</title>
</head>

<body>
    <div id="contenedor">
        <div id="logo">
           <!-- <img src="/Burguir-Reto/media/logo-login.png" alt="Logo">-->
        </div>
        <div id="formularioLogin">
            <form id="formulario">
                <div class="campoLogin">
                    <label for="txtUsuario">usuario: </label>
                    <input type="text" id="txtUsuario" required>
                </div>
                <div class="campoLogin">
                    <label for="pswContraseña">Contraseña: </label>
                    <input type="password" id="pswContraseña" required>
                </div>
                <div id="boton">
                    <input id="btnLogin" type="submit">
                </div>
            </form>
        </div>
        <div id="divRegistrar">
            <p>¿No tienes cuenta? <a href="">Registrate</a></p>
        </div>
    </div>
    <script type="module" src="../js/login.js"></script>
</body>

</html>
